<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>สมาชิก · หารด้วย</title>
  <meta name="description" content="หารด้วย — ผู้ช่วยหารค่าเที่ยวกับเพื่อน คำนวณว่าใครต้องโอนให้ใคร พร้อม QR พร้อมเพย์">
  <meta name="theme-color" content="#20a977">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611041617">
</head>
<body>
  <div class="content">
    <section class="page-heading">
      <div><span class="eyebrow">ทีมเที่ยว</span><h1>สมาชิกในทริป</h1><p>เพิ่มเพื่อนร่วมทริป และเบอร์พร้อมเพย์สำหรับรับเงินคืน</p></div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2 id="memFormTitle">เพิ่มสมาชิก</h2><p>ใส่พร้อมเพย์ไว้ ระบบจะสร้าง QR พร้อมยอดเงินให้เพื่อนสแกนโอนคืนได้ทันที</p></div></div>
      <form id="memberForm" class="form-grid three">
        <label><span>ชื่อ</span><input id="mName" required maxlength="30" autocomplete="off" placeholder="เช่น สมชาย"></label>
        <label><span>พร้อมเพย์ (ไม่บังคับ)</span><input id="mPP" inputmode="numeric" autocomplete="off" placeholder="เบอร์มือถือ / เลขบัตรประชาชน"></label>
        <div class="row" style="flex-wrap:nowrap">
          <button type="button" class="cancel-btn" id="memCancel" hidden>ยกเลิก</button>
          <button class="primary-btn" id="memSubmit"></button>
        </div>
      </form>
    </section>
    <section class="panel" id="memberPanel"></section>
  </div>
  <script src="js/common.js?v=202611041617"></script>
  <script src="js/members.js?v=202611041617"></script>
</body>
</html>
