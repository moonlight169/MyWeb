<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ค่าใช้จ่าย · หารด้วย</title>
  <meta name="theme-color" content="#0f8a6c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap page">
    <h1 class="page-title">🧾 รายการค่าใช้จ่าย</h1>
    <div class="card">
      <h2 id="expFormTitle">เพิ่มค่าใช้จ่าย</h2>
      <form id="expForm">
        <div class="grid">
          <label class="span2">รายการ<input id="eTitle" required maxlength="60" placeholder="เช่น ค่าที่พัก, ข้าวเย็น" autocomplete="off"></label>
          <label>จำนวนเงิน (บาท)<input id="eAmount" type="number" step="0.01" min="0.01" required inputmode="decimal" placeholder="0.00"></label>
          <label>หมวด<select id="eCat"></select></label>
          <label>ใครจ่าย<select id="ePayer" required></select></label>
          <label>วันที่<input id="eDate" type="date"></label>
        </div>
        <div class="among-head">
          <span>หารกับใครบ้าง <span class="sub" id="eachPreview"></span></span>
          <span><button type="button" class="link" id="selAll">เลือกทั้งหมด</button> · <button type="button" class="link" id="selNone">ไม่เลือก</button></span>
        </div>
        <div id="eAmong" class="chips"></div>
        <div class="actions">
          <button type="button" id="expCancel" class="btn ghost" hidden>ยกเลิก</button>
          <button class="btn primary" id="expSubmit">บันทึกรายการ</button>
        </div>
      </form>
      <div class="empty" id="expNeedMembers" hidden>ต้องมีสมาชิกก่อน แล้วค่อยบันทึกค่าใช้จ่าย<br><a class="btn primary" href="members.html">ไปเพิ่มสมาชิก</a></div>
    </div>
    <div id="expList" class="list"></div>
    <div id="stepNav"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
