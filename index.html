<body>
  <div class="content">
    <div id="dash"></div>
    <section class="panel" id="manage" style="margin-top:16px">
      <div class="panel-head"><div><h2>จัดการข้อมูลทริป</h2><p>ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ เพื่อนจะเห็นผ่านลิงก์รายงานที่คุณส่งให้</p></div></div>
      <div class="row">
        <button class="outline-btn" id="demoBtn">ลองใช้ข้อมูลตัวอย่าง</button>
        <button class="outline-btn danger" id="resetBtn">ล้างข้อมูล เริ่มทริปใหม่</button>
      </div>
      <div class="confirm" id="resetConfirm" hidden>
        <span id="resetMsg"></span>
        <span class="row"><button class="danger-fill" id="resetYes">ยืนยัน</button><button class="cancel-btn" id="resetNo" style="min-height:38px">ยกเลิก</button></span>
      </div>
    </section>
  </div>
  <script src="js/common.js?v=202611041617"></script>
